kind = "mobile"
previewPath = "/pregasquad-mobile/"
title = "PREGA SQUAD Mobile"
version = "1.0.0"
id = "artifacts/pregasquad-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/pregasquad-mobile/" ]
localPort = 22977

[services.development]
run = "pnpm --filter @workspace/pregasquad-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pregasquad-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/pregasquad-mobile", "run", "serve" ]

[services.env]
PORT = "22977"
BASE_PATH = "/pregasquad-mobile/"
