kind = "web"
previewPath = "/"
title = "PREGA SQUAD Manager"
version = "1.0.0"
id = "artifacts/pregasquad-manager"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5000

[services.development]
run = "PORT=5000 BASE_PATH=/ pnpm --filter @workspace/pregasquad-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pregasquad-manager", "run", "build" ]
publicDir = "artifacts/pregasquad-manager/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5000"
BASE_PATH = "/"
